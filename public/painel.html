<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahçaí - Painel de Pedidos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #a855f7;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        #containerPedidos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .pedido-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .pedido-card h3 {
            margin-top: 0;
            color: #c084fc;
        }
        .btn-pronto {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-pronto:hover {
            background-color: #16a34a;
        }
        .status-pronto {
            color: #22c55e;
            font-weight: bold;
        }
        .sem-pedidos {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            font-size: 1.2rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>🍇 Ahçaí - Painel de Pedidos</h1>
    <div class="subtitle">Acompanhamento de pedidos em tempo real</div>

    <div id="containerPedidos">
        <div class="sem-pedidos">Carregando pedidos...</div>
    </div>

    <script>
        function buscarPedidos() {
            fetch('/api/pedidos')
                .then(response => response.json())
                .then(pedidos => {
                    const container = document.getElementById('containerPedidos');
                    container.innerHTML = '';

                    if (!pedidos || pedidos.length === 0) {
                        container.innerHTML = `<div class="sem-pedidos">Nenhum pedido no momento. Aguardando clientes... 🍇</div>`;
                        return;
                    }

                    pedidos.forEach(pedido => {
                        const card = document.createElement('div');
                        card.className = 'pedido-card';
                        
                        let complementosTexto = Array.isArray(pedido.complementos) 
                            ? pedido.complementos.join(', ') 
                            : (pedido.complementos || 'Nenhum');

                        card.innerHTML = `
                            <h3>Pedido #${pedido.id}</h3>
                            <p><strong>Cliente:</strong> ${pedido.cliente || 'Não informado'}</p>
                            <p><strong>Telefone:</strong> ${pedido.telefone || '-'}</p>
                            <p><strong>Endereço:</strong> ${pedido.endereco || '-'}</p>
                            <hr style="border-color: #333;">
                            <p><strong>Tamanho:</strong> ${pedido.tamanho || '-'}</p>
                            <p><strong>Base:</strong> ${pedido.saborBase || '-'}</p>
                            <p><strong>Adocamento:</strong> ${pedido.formaAdocamento || '-'}</p>
                            <p><strong>Complementos:</strong> ${complementosTexto}</p>
                            <p><strong>Total:</strong> R$ ${pedido.precoTotal || '0,00'}</p>
                            <p><strong>Status:</strong> <span class="${pedido.status === 'Pronto' ? 'status-pronto' : ''}">${pedido.status}</span></p>
                            
                            ${pedido.status !== 'Pronto' ? `<button class="btn-pronto" onclick="marcarPronto(${pedido.id})">Marcar como Pronto</button>` : ''}
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(erro => console.error('Erro ao buscar pedidos:', erro));
        }

        function marcarPronto(id) {
            fetch(`/api/pedido/${id}/status`, {
                method: 'PUT'
            })
            .then(response => response.json())
            .then(() => {
                buscarPedidos(); // Atualiza a tela na hora
            })
            .catch(erro => console.error('Erro ao atualizar status:', erro));
        }

        // Atualiza a cada 3 segundos automaticamente
        setInterval(buscarPedidos, 3000);

        // Busca assim que a página abre
        buscarPedidos();
    </script>
</body>
</html>
